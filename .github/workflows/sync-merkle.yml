name: Sync Merkle Tree

on:
  # Run hourly. Adjust the cron if you want more/less frequent updates.
  # Format: minute hour day month weekday
  schedule:
    - cron: '0 * * * *'

  # Also allow triggering manually from the GitHub Actions tab —
  # useful right after a testnet deploy or an NFT transfer you want live immediately.
  workflow_dispatch:

permissions:
  contents: write   # needed to push the merkle.json commit back

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use a PAT instead of GITHUB_TOKEN if you want the push to trigger
          # a Vercel deployment (Vercel ignores pushes made by GITHUB_TOKEN).
          # Set DEPLOY_TOKEN in repo secrets (Settings → Secrets → Actions).
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install script dependencies
        working-directory: scripts
        run: pnpm install --frozen-lockfile

      - name: Rebuild merkle tree
        working-directory: scripts
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: npx tsx update-merkle.ts

      - name: Commit updated files if tree changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/deployments.json frontend/public/circuits/merkle.json
          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "No changes — merkle root unchanged, nothing to commit."
          else
            git commit -m "chore: sync merkle tree [skip ci]"
            git push
          fi
